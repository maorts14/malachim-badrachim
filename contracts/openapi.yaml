      operationId: auth_whoami_retrieve
      description: |-
        **Use this before testing anything else.**

        Send a JWT as `Authorization: Bearer <access>` or sign in through the web session. If you get a 200 back, you are authenticated and ready to test all other endpoints.
      summary: Verify your token works (start here)
      tags:
      - TEST
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Token accepted — returns your identity
        '401':
          description: Missing, expired, or invalid token
