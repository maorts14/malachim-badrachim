components:
  schemas:
    Alert:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        status:
          $ref: '#/components/schemas/StatusEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        assignments:
          type: array
          items:
            type: object
            properties:
              user_id:
                type: integer
              username:
                type: string
              status:
                type: string
              dispatched_at:
                type: string
                format: date-time
              responded_at:
                type: string
                format: date-time
                nullable: true
          readOnly: true
      required:
      - assignments
      - created_at
      - id
      - latitude
      - longitude
      - title
      - updated_at
    DeviceRegistration:
      type: object
      properties:
        push_token:
          type: string
        device_id:
          type: string
          maxLength: 256
        platform:
          $ref: '#/components/schemas/PlatformEnum'
        device_model:
          type: string
          default: ''
          maxLength: 128
      required:
      - device_id
      - platform
      - push_token
    Group:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        members:
          type: array
          items:
            type: integer
      required:
      - id
      - members
      - name
    Message:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        sender:
          type: object
          properties:
            id:
              type: integer
            username:
              type: string
            email:
              type: string
              format: email
            role:
              type: string
              nullable: true
          readOnly: true
        alert:
          type: integer
          nullable: true
        group:
          type: integer
          nullable: true
        title:
          type: string
          maxLength: 255
        text:
          type: string
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - sender
      - timestamp
      - title
    Notification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        token:
          type: string
          maxLength: 255
      required:
      - id
      - token
      - user
    PatchedAlert:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        status:
          $ref: '#/components/schemas/StatusEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        assignments:
          type: array
          items:
            type: object
            properties:
              user_id:
                type: integer
              username:
                type: string
              status:
                type: string
              dispatched_at:
                type: string
                format: date-time
              responded_at:
                type: string
                format: date-time
                nullable: true
          readOnly: true
    PatchedGroup:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        members:
          type: array
          items:
            type: integer
    PatchedMessage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        sender:
          type: object
          properties:
            id:
              type: integer
            username:
              type: string
            email:
              type: string
              format: email
            role:
              type: string
              nullable: true
          readOnly: true
        alert:
          type: integer
          nullable: true
        group:
          type: integer
          nullable: true
        title:
          type: string
          maxLength: 255
        text:
          type: string
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
    PatchedNotification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        token:
          type: string
          maxLength: 255
    PatchedUserProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        display_name:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 32
        role:
          $ref: '#/components/schemas/RoleEnum'
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
    PlatformEnum:
      enum:
      - android
      - ios
      - other
      type: string
      description: |-
        * `android` - android
        * `ios` - ios
        * `other` - other
    PriorityEnum:
      enum:
      - LOW
      - MEDIUM
      - HIGH
      - CRITICAL
      type: string
      description: |-
        * `LOW` - Low
        * `MEDIUM` - Medium
        * `HIGH` - High
        * `CRITICAL` - Critical
    RoleEnum:
      enum:
      - manager
      - emergency_dispatcher
      - user
      type: string
      description: |-
        * `manager` - Manager
        * `emergency_dispatcher` - Emergency dispatcher
        * `user` - Volunteer
    StatusEnum:
      enum:
      - OPEN
      - DISPATCHED
      - ACCEPTED
      - IN_PROGRESS
      - RESOLVED
      - CANCELLED
      type: string
      description: |-
        * `OPEN` - Open
        * `DISPATCHED` - Dispatched
        * `ACCEPTED` - Accepted
        * `IN_PROGRESS` - In Progress
        * `RESOLVED` - Resolved
        * `CANCELLED` - Cancelled
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    UserProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        display_name:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 32
        role:
          $ref: '#/components/schemas/RoleEnum'
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
      required:
      - email
      - id
      - user_id
      - username
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: TEST
  description: "\U0001F534 **Start here.** Use `GET /api/auth/whoami/` to confirm
    your token is valid before calling any other endpoint. A 200 response means you
    are authenticated."
- name: auth
  description: Registration, JWT login, and web-session login.
- name: alerts
  description: Create and retrieve fire/rescue alerts.
- name: user
  description: User profiles and location updates.
- name: group
  description: Rescue groups and membership.
- name: message
  description: In-app messages between users.
- name: notification
  description: Push notification records.
