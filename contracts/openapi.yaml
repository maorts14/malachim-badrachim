      - group
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: A short-lived LiveKit token scoped to this group room and the
            authenticated participant.
        '404':
          description: The group is unavailable to the authenticated user.
        '503':
          description: Realtime PTT is not configured on this deployment.
